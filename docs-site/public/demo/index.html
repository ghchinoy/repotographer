  <script type="module">
    import cytoscape from 'https://esm.sh/cytoscape@3.30.4';
    import fcose from 'https://esm.sh/cytoscape-fcose@2.2.0';

    try { cytoscape.use(fcose); } catch(e) {}

    const rawData = JSON.parse(document.getElementById('graph-data').textContent);

    let cy;
    let collapsedDomains = new Set((rawData.domains || []).map(d => d.id));
    let expandedSubBuckets = new Set();
    let hideStandalone = false;
    let activeFilter = 'all';
    let allExpanded = false;
    let selectedNode = null;

    const colors = {
      bg: '#0f172a',
      parentBg: 'rgba(30, 41, 59, 0.45)',
      parentBorder: '#475569',
      collapsedBg: '#1e293b',
      collapsedBorder: '#38bdf8',
      repoBg: '#334155',
      repoBorder: '#64748b',
      subBucketBg: '#1e293b',
      subBucketBorder: '#64748b',
      techBg: '#f59e0b',
      techBorder: '#fbbf24',
      techText: '#0f172a',
      textMain: '#f8fafc',
      textMuted: '#94a3b8',
      edgeColor: '#475569',
      edgeActive: '#38bdf8',
      brandPrimary: '#38bdf8'
    };

    function buildStyles() {
      return [
        {
          selector: 'node[?isDomain][!isCollapsed]',
          style: {
            'background-color': colors.parentBg,
            'border-color': colors.parentBorder,
            'border-width': 1.5,
            'border-style': 'dashed',
            'shape': 'roundrectangle',
            'corner-radius': '12px',
            'label': 'data(displayLabel)',
            'font-family': 'Inter, system-ui, sans-serif',
            'font-size': '11px',
            'font-weight': '700',
            'text-valign': 'top',
            'text-halign': 'center',
            'text-margin-y': 10,
            'color': colors.textMuted,
            'text-transform': 'uppercase',
            'letter-spacing': '0.05em',
            'padding': '26px',
            'cursor': 'pointer'
          }
        },
        {
          selector: 'node[?isDomain][?isCollapsed]',
          style: {
            'shape': 'round-rectangle',
            'corner-radius': '10px',
            'width': 'label',
            'height': 'label',
            'padding': '18px',
            'text-wrap': 'wrap',
            'text-max-width': '190px',
            'background-color': colors.collapsedBg,
            'border-width': 2.5,
            'border-color': colors.collapsedBorder,
            'border-style': 'solid',
            'label': 'data(displayLabel)',
            'font-family': 'Inter, system-ui, sans-serif',
            'font-size': '12px',
            'font-weight': '700',
            'color': colors.textMain,
            'text-valign': 'center',
            'text-halign': 'center',
            'cursor': 'pointer',
            'z-index': 15
          }
        },
        {
          selector: 'node[?isSubBucket]',
          style: {
            'shape': 'round-rectangle',
            'corner-radius': '6px',
            'width': 'label',
            'height': 'label',
            'padding': '8px',
            'text-wrap': 'wrap',
            'text-max-width': '130px',
            'background-color': colors.subBucketBg,
            'border-width': 1.5,
            'border-style': 'dashed',

        },
        { selector: '.faded', style: { 'opacity': 0.12 } },
        { selector: 'edge.faded', style: { 'opacity': 0.04 } },
        { selector: '.hidden', style: { 'display': 'none' } }
      ];
    }

    let currentLayout = null;
    let lastExpandedDomain = null;
    let userHasInteracted = false;

    function initGraph() {
      const container = document.getElementById('cy');
      cy = cytoscape({
        container: container,
        style: buildStyles(),
        wheelSensitivity: 0.25,
        minZoom: 0.25,
        maxZoom: 3.0
      });

      
      container.addEventListener('pointerdown', () => {
        userHasInteracted = true;
      });

      
      const cyObserver = new ResizeObserver(() => {
        if (cy) {
          cy.resize();
          if (!userHasInteracted) {
            safeFit(cy.nodes(), 60);
          }
        }
      });
      cyObserver.observe(container);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { if (cy) cy.resize(); });
      }

      cy.on('tap', (evt) => {
        if (evt.target === cy) {
          clearHighlighting();
          closeInspector();
        }
      });

      cy.on('tap', 'node', (evt) => {
        const node = evt.target;
        userHasInteracted = true;

        if (node.data('isSubBucket')) {
          const domainId = node.data('domainId');
          if (expandedSubBuckets.has(domainId)) expandedSubBuckets.delete(domainId);
          else expandedSubBuckets.add(domainId);
          loadData();
          return;
        }
        if (node.data('isDomain') || node.isParent()) {
          const id = node.id();
          if (collapsedDomains.has(id)) {
            collapsedDomains.delete(id);
            lastExpandedDomain = id;
          } else {
            collapsedDomains.add(id);
            expandedSubBuckets.delete(id);
            lastExpandedDomain = null;
          }
          allExpanded = collapsedDomains.size === 0;
          document.getElementById('btnExpandAll').textContent = allExpanded ? '⊟' : '⊞';
          loadData();
          return;
        }
        selectNode(node);
      });

      
      const btnLegend = document.getElementById('btnLegend');
      const legendPopover = document.getElementById('legendPopover');
      if (btnLegend && legendPopover) {
        btnLegend.onclick = () => {
          const isClosed = legendPopover.style.display === 'none';
          legendPopover.style.display = isClosed ? 'flex' : 'none';
          btnLegend.textContent = isClosed ? '✕ Close' : 'ℹ Legend';
        };
      }

      setupSearch();
      loadData();
      renderFilters();
    }

    function safeFit(eles, padding = 50) {
      if (!cy) return;
      const targetEles = (eles && eles.length > 0) ? eles : cy.nodes();
      if (!targetEles || targetEles.length === 0) return;

      cy.fit(targetEles, padding);
      cy.center(targetEles);

      const z = cy.zoom();
      if (z < 0.55) {
        cy.zoom(0.55);
        cy.center(targetEles);
      } else if (z > 1.25) {
        cy.zoom(1.25);
        cy.center(targetEles);
      }
    }

    function loadData() {
      cy.elements().remove();
      const elements = [];
      const domainItemCounts = {};
      const domainConnectedCounts = {};
      const domainStandaloneCounts = {};
      const childToDomainMap = {};

      (rawData.nodes || []).forEach(n => {
        if (n.parent) {
          domainItemCounts[n.parent] = (domainItemCounts[n.parent] || 0) + 1;
          childToDomainMap[n.id] = n.parent;
          if ((n.connectivity || 'connected') === 'connected') domainConnectedCounts[n.parent] = (domainConnectedCounts[n.parent] || 0) + 1;
          else domainStandaloneCounts[n.parent] = (domainStandaloneCounts[n.parent] || 0) + 1;
        }
      });

      const isAllCollapsed = (rawData.domains || []).length > 0 &&
        collapsedDomains.size === (rawData.domains || []).length;

      (rawData.domains || []).forEach(d => {
        const isCollapsed = collapsedDomains.has(d.id);
        const count = domainItemCounts[d.id] || 0;
        elements.push({
          group: 'nodes',
          data: {
            id: d.id,
            label: d.label,
            displayLabel: isCollapsed ? `⊞ ${d.label} (${count})` : `⊟ ${d.label}`,
            isDomain: true,
            isCollapsed: isCollapsed,
            childCount: count
          }
        });

        if (!isCollapsed) {
          const standaloneCount = domainStandaloneCounts[d.id] || 0;
          if (standaloneCount > 0) {
            const isSubExpanded = expandedSubBuckets.has(d.id);
            elements.push({
              group: 'nodes',
              data: {
                id: `subbucket_${d.id}`,
                parent: d.id,
                domainId: d.id,
                label: isSubExpanded ? `⊟ Standalone (${standaloneCount})` : `⊕ Standalone · ${standaloneCount}`,
                isSubBucket: true,
                isSubExpanded: isSubExpanded
              }
            });
          }
        }
      });

      
      if (!isAllCollapsed && rawData.nodes) {
        const activeTechHubs = new Set();

        (rawData.nodes || []).forEach(n => {
          if (n.type === 'tech') return;

          
          if (n.parent && collapsedDomains.has(n.parent)) return;

          const isConn = (n.connectivity || 'connected') === 'connected';
          const isSubExpanded = n.parent && expandedSubBuckets.has(n.parent);

          
          if (!isConn && !isSubExpanded) return;

          
          if (hideStandalone && !isConn) return;

          
          if (activeFilter && activeFilter !== 'all') {
            const stack = n.stack || [];
            if (!stack.includes(activeFilter)) return;
          }

          elements.push({
            group: 'nodes',
            data: { ...n, parent: n.parent },
            classes: `node-${n.connectivity || 'connected'}`
          });

          if (n.stack && Array.isArray(n.stack)) {
            n.stack.forEach(s => activeTechHubs.add(s));
          }
        });

        
        (rawData.nodes || []).forEach(n => {
          if (n.type === 'tech') {
            const techStacks = n.stack || [];
            const isRelevant = techStacks.some(s => activeTechHubs.has(s)) ||
              (rawData.edges || []).some(e => {
                const other = e.source === n.id ? e.target : (e.target === n.id ? e.source : null);
                return other && elements.some(el => el.data.id === other);
              });

            if (isRelevant) {
              elements.push({
                group: 'nodes',
                data: { ...n },
                classes: 'node-tech'
              });
            }
          }
        });
      }

      
      const mountedNodeIds = new Set(elements.map(el => el.data.id));
      const virtualEdgeSet = new Set();

      (rawData.edges || []).forEach(e => {
        const sourceMounted = mountedNodeIds.has(e.source);
        const targetMounted = mountedNodeIds.has(e.target);

        if (sourceMounted && targetMounted) {
          elements.push({ group: 'edges', data: { ...e } });
        } else {
          const srcDomain = childToDomainMap[e.source];
          const tgtDomain = childToDomainMap[e.target];

          const effSrc = sourceMounted ? e.source : (srcDomain && mountedNodeIds.has(srcDomain) ? srcDomain : null);
          const effTgt = targetMounted ? e.target : (tgtDomain && mountedNodeIds.has(tgtDomain) ? tgtDomain : null);

          if (effSrc && effTgt && effSrc !== effTgt) {
            
            if (isAllCollapsed && (!srcDomain || !tgtDomain)) return;

            const vKey = `${effSrc}->${effTgt}`;
            if (!virtualEdgeSet.has(vKey)) {
              virtualEdgeSet.add(vKey);
              elements.push({
                group: 'edges',
                data: { id: `virt_${vKey}`, source: effSrc, target: effTgt, label: '' },
                classes: 'virtual-summary-edge'
              });
            }
          }
        }
      });

      cy.add(elements);
      runLayout();
    }

    function runLayout() {
      if (currentLayout) {
        try { currentLayout.stop(); } catch(e) {}
      }

      const isAllCollapsed = (rawData.domains || []).length > 0 &&
        collapsedDomains.size === (rawData.domains || []).length;

      if (isAllCollapsed) {
        
        const domainCount = (rawData.domains || []).length;
        const cols = domainCount <= 4 ? 2 : 3;
        currentLayout = cy.layout({
          name: 'grid',
          rows: 2,
          cols: cols,
          fit: true,
          padding: 80,
          avoidOverlap: true,
          animate: true,
          animationDuration: 280,
          stop: () => safeFit(cy.nodes(), 80)
        });
        currentLayout.run();
        return;
      }

      const visibleCount = cy.nodes().length;
      const visibleEdges = cy.edges().length;
      const density = visibleEdges / Math.max(1, visibleCount);

      let idealEdgeLength, nodeSeparation, edgeElasticity, gravity, numIter, quality;

      if (visibleCount < 30) {
        if (density > 1.2) {
          idealEdgeLength = 220; nodeSeparation = 130; edgeElasticity = 0.06; gravity = 0.06; numIter = 2200; quality = 'proof';
        } else {
          idealEdgeLength = 170; nodeSeparation = 110; edgeElasticity = 0.10; gravity = 0.08; numIter = 1800; quality = 'proof';
        }
      } else if (visibleCount < 60) {
        idealEdgeLength = 130; nodeSeparation = 85; edgeElasticity = 0.20; gravity = 0.15; numIter = 1400; quality = 'default';
      } else {
        idealEdgeLength = 95; nodeSeparation = 65; edgeElasticity = 0.35; gravity = 0.20; numIter = 1000; quality = 'default';
      }

      try {
        currentLayout = cy.layout({
          name: 'fcose',
          quality: quality,
          randomize: false,
          animate: true,
          animationDuration: 300,
          nodeDimensionsIncludeLabels: true,
          uniformNodeDimensions: false,
          packComponents: false,
          nodeSeparation: nodeSeparation,
          idealEdgeLength: idealEdgeLength,
          edgeElasticity: edgeElasticity,
          nestingFactor: 0.1,
          gravity: gravity,
          gravityRange: 4.0,
          numIter: numIter,
          tile: true,
          tilingPaddingVertical: 20,
          tilingPaddingHorizontal: 20,
          fit: true,
          padding: 40,
          stop: () => {
            if (lastExpandedDomain) {
              const dNode = cy.getElementById(lastExpandedDomain);
              const children = cy.nodes(`[parent = "${lastExpandedDomain}"]`);
              const focusGroup = dNode.add(children);
              if (focusGroup.length > 0) {
                safeFit(focusGroup, 50);
              }
              lastExpandedDomain = null;
            } else if (!userHasInteracted) {
              safeFit(cy.nodes(), 45);
            }
          }
        });
        currentLayout.run();
      } catch (err) {
        currentLayout = cy.layout({
          name: 'cose',
          fit: true,
          padding: 40,
          animate: false,
          stop: () => safeFit(cy.nodes(), 45)
        });
        currentLayout.run();
      }
    }

    function renderFilters() {
      const container = document.getElementById('filterBar');
      container.innerHTML = '';

      const tags = new Set(['all']);
      (rawData.nodes || []).forEach(n => {
        (n.stack || []).forEach(s => tags.add(s));
      });

      tags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = `filter-chip ${tag === activeFilter ? 'active' : ''}`;
        btn.textContent = tag.toUpperCase();
        btn.onclick = () => {
          container.querySelectorAll('.filter-chip:not(.filter-chip-toggle)').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          activeFilter = tag;
          loadData();
        };
        container.appendChild(btn);
      });

      const toggleBtn = document.createElement('button');
      toggleBtn.className = `filter-chip filter-chip-toggle ${hideStandalone ? 'active' : ''}`;
      toggleBtn.innerHTML = '<span>⚡ Connected Only</span>';
      toggleBtn.onclick = () => {
        hideStandalone = !hideStandalone;
        toggleBtn.classList.toggle('active', hideStandalone);
        loadData();
      };
      container.appendChild(toggleBtn);
    }

    function selectNode(node) {
      selectedNode = node.data();
      cy.batch(() => {
        cy.elements().removeClass('highlighted faded');
        node.addClass('highlighted');
        const nh = node.neighborhood();
        nh.addClass('highlighted');
        cy.elements().not(node).not(nh).addClass('faded');
      });

      cy.animate({
        center: { eles: node },
        zoom: Math.max(cy.zoom(), 0.88),
        duration: 350,
        easing: 'ease-out-cubic'
      });

      openInspector(selectedNode);
    }

    function clearHighlighting() {
      selectedNode = null;
      cy.elements().removeClass('highlighted faded');
    }

    function openInspector(data) {
      const insp = document.getElementById('inspector');
      document.getElementById('inspTitle').textContent = data.label;
      document.getElementById('inspDesc').textContent = data.desc || '(No description provided)';

      const domainEl = document.getElementById('inspDomain');
      const domain = (rawData.domains || []).find(d => d.id === data.parent);
      domainEl.innerHTML = `<span>${domain ? domain.label : (data.type === 'tech' ? 'Core Technology' : '')}</span>`;
      if (data.connectivity && data.type !== 'tech') {
        const badge = document.createElement('span');
        badge.className = `conn-badge conn-${data.connectivity}`;
        badge.textContent = data.connectivity.toUpperCase();
        domainEl.appendChild(badge);
      }

      const tagsEl = document.getElementById('inspTags');
      tagsEl.innerHTML = '';
      (data.stack || []).forEach(s => {
        const badge = document.createElement('span');
        badge.className = 'tag-badge';
        badge.textContent = s;
        tagsEl.appendChild(badge);
      });

      
      const connEl = document.getElementById('inspConnections');
      if (connEl) {
        connEl.innerHTML = '';
        const neighbors = getConnectedNeighbors(data.id);
        if (neighbors && neighbors.length > 0) {
          const lbl = document.createElement('div');
          lbl.className = 'inspector-section-label';
          lbl.textContent = `Connected Nodes (${neighbors.length})`;
          connEl.appendChild(lbl);

          const list = document.createElement('div');
          list.className = 'inspector-neighbors-list';
          neighbors.forEach(nbr => {
            const btn = document.createElement('button');
            btn.className = `inspector-nbr-btn nbr-${nbr.type}`;
            btn.innerHTML = `<span class="nbr-indicator"></span><span class="nbr-label">${nbr.label}</span>`;
            btn.title = `Jump to ${nbr.label}`;
            btn.onclick = () => focusNode(nbr.id);
            list.appendChild(btn);
          });
          connEl.appendChild(list);
        }
      }

      const linksEl = document.getElementById('inspLinks');
      linksEl.innerHTML = '';
      if (data.url) {
        linksEl.innerHTML = `<a href="${data.url}" target="_blank" rel="noopener noreferrer">View on GitHub ↗</a>`;
      }

      insp.classList.add('open');
    }

    function closeInspector() {
      document.getElementById('inspector').classList.remove('open');
      clearHighlighting();
    }

    function getConnectedNeighbors(nodeId) {
      const neighborMap = new Map();
      (rawData.edges || []).forEach(e => {
        let otherId = null;
        if (e.source === nodeId) otherId = e.target;
        else if (e.target === nodeId) otherId = e.source;

        if (otherId && !neighborMap.has(otherId)) {
          const found = (rawData.nodes || []).find(n => n.id === otherId);
          if (found) {
            neighborMap.set(otherId, {
              id: found.id,
              label: found.label || found.id,
              type: found.type || 'repo'
            });
          }
        }
      });
      return Array.from(neighborMap.values());
    }

    function focusDomain(domainId) {
      userHasInteracted = true;
      if (collapsedDomains.has(domainId)) {
        collapsedDomains.delete(domainId);
        lastExpandedDomain = domainId;
        loadData();
      } else {
        const dNode = cy.getElementById(domainId);
        const children = cy.nodes(`[parent = "${domainId}"]`);
        safeFit(dNode.add(children), 50);
      }
    }

    function focusNode(nodeId) {
      userHasInteracted = true;
      const isDomain = (rawData.domains || []).some(d => d.id === nodeId);
      if (isDomain) {
        focusDomain(nodeId);
        return;
      }

      const nodeInfo = (rawData.nodes || []).find(n => n.id === nodeId);
      if (!nodeInfo) return;

      let needsReload = false;
      if (nodeInfo.parent && collapsedDomains.has(nodeInfo.parent)) {
        collapsedDomains.delete(nodeInfo.parent);
        lastExpandedDomain = nodeInfo.parent;
        needsReload = true;
      }

      const isConn = (nodeInfo.connectivity || 'connected') === 'connected';
      if (!isConn && nodeInfo.parent && !expandedSubBuckets.has(nodeInfo.parent)) {
        expandedSubBuckets.add(nodeInfo.parent);
        needsReload = true;
      }

      if (needsReload) {
        loadData();
      }

      setTimeout(() => {
        const target = cy.getElementById(nodeId);
        if (target && target.length > 0) {
          selectNode(target);
        }
      }, needsReload ? 350 : 20);
    }

    function setupSearch() {
      const input = document.getElementById('searchInput');
      const dropdown = document.getElementById('searchDropdown');
      const clearBtn = document.getElementById('searchClear');
      if (!input || !dropdown) return;

      input.oninput = () => {
        const q = input.value.trim().toLowerCase();
        if (!q) {
          dropdown.style.display = 'none';
          dropdown.innerHTML = '';
          if (clearBtn) clearBtn.style.display = 'none';
          return;
        }

        if (clearBtn) clearBtn.style.display = 'block';

        const matchedDomains = (rawData.domains || []).filter(d =>
          d.label.toLowerCase().includes(q)
        );
        const matchedTech = (rawData.nodes || []).filter(n =>
          n.type === 'tech' && n.label.toLowerCase().includes(q)
        );
        const matchedRepos = (rawData.nodes || []).filter(n =>
          n.type !== 'tech' && (
            n.label.toLowerCase().includes(q) ||
            (n.desc || '').toLowerCase().includes(q) ||
            (n.stack || []).some(s => s.toLowerCase().includes(q))
          )
        ).slice(0, 8);

        const total = matchedDomains.length + matchedTech.length + matchedRepos.length;
        if (total === 0) {
          dropdown.innerHTML = '<div class="search-empty">No matching repositories or domains</div>';
          dropdown.style.display = 'block';
          return;
        }

        dropdown.innerHTML = '';
        matchedDomains.forEach(d => {
          const item = document.createElement('div');
          item.className = 'search-result';
          item.innerHTML = `<span class="res-badge res-domain">Domain</span><span class="res-label">${d.label}</span>`;
          item.onclick = () => {
            focusDomain(d.id);
            dropdown.style.display = 'none';
          };
          dropdown.appendChild(item);
        });

        matchedTech.forEach(t => {
          const item = document.createElement('div');
          item.className = 'search-result';
          item.innerHTML = `<span class="res-badge res-tech">Core Tech</span><span class="res-label">${t.label}</span>`;
          item.onclick = () => {
            focusNode(t.id);
            dropdown.style.display = 'none';
          };
          dropdown.appendChild(item);
        });

        matchedRepos.forEach(r => {
          const item = document.createElement('div');
          item.className = 'search-result';
          item.innerHTML = `<span class="res-badge res-repo">Repo</span><span class="res-label">${r.label}</span>`;
          item.onclick = () => {
            focusNode(r.id);
            dropdown.style.display = 'none';
          };
          dropdown.appendChild(item);
        });

        dropdown.style.display = 'block';
      };

      if (clearBtn) {
        clearBtn.onclick = () => {
          input.value = '';
          dropdown.style.display = 'none';
          clearBtn.style.display = 'none';
          input.focus();
        };
      }

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-box')) {
          dropdown.style.display = 'none';
        }
      });
    }

    document.getElementById('inspClose').onclick = closeInspector;
    document.getElementById('btnFit').onclick = () => {
      userHasInteracted = true;
      safeFit(cy.nodes(), 50);
    };
    document.getElementById('btnZoomIn').onclick = () => {
      userHasInteracted = true;
      const center = { x: cy.width() / 2, y: cy.height() / 2 };
      cy.zoom({ level: Math.min(cy.maxZoom(), cy.zoom() * 1.25), renderedPosition: center });
    };
    document.getElementById('btnZoomOut').onclick = () => {
      userHasInteracted = true;
      const center = { x: cy.width() / 2, y: cy.height() / 2 };
      cy.zoom({ level: Math.max(cy.minZoom(), cy.zoom() * 0.8), renderedPosition: center });
    };
    document.getElementById('btnExpandAll').onclick = () => {
      userHasInteracted = true;
      lastExpandedDomain = null;
      if (allExpanded) {
        collapsedDomains = new Set((rawData.domains || []).map(d => d.id));
        expandedSubBuckets.clear();
        allExpanded = false;
      } else {
        collapsedDomains.clear();
        allExpanded = true;
      }
      document.getElementById('btnExpandAll').textContent = allExpanded ? '⊟' : '⊞';
      loadData();
    };
    document.getElementById('btnReset').onclick = () => {
      collapsedDomains = new Set((rawData.domains || []).map(d => d.id));
      expandedSubBuckets.clear();
      allExpanded = false;
      activeFilter = 'all';
      hideStandalone = false;
      userHasInteracted = false;
      lastExpandedDomain = null;
      document.getElementById('btnExpandAll').textContent = '⊞';
      renderFilters();
      loadData();
      closeInspector();
    };

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initGraph);
    } else {
      initGraph();
    }
  </script>
</body>
</html>
